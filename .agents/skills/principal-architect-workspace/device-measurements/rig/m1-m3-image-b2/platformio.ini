; device-measurements WO1 - image B2 (M1 frame loop, M3 blocked-loop repaint). Build only.
; Board section copied from ../device/platformio.ini [device]. The UI is the scratch project in
; ui/ (generated by this worktree's CLI into ui/generated), not foundation's diagnostics screen.

[platformio]
default_envs = m1

[device]
platform              = espressif32
board                 = arduino_nano_esp32
framework             = arduino
upload_protocol       = esptool
monitor_speed         = 115200
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_src_filter      = +<*> +<../ui/generated/>
build_flags           =
    -std=gnu++17
    -I ui/generated
    -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\"
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
build_unflags         = -std=gnu++11
lib_ldf_mode          = deep+

[env:m1]
extends               = device
lib_deps              =
    symlink://${U8G2GL_WORKTREE}
    olikraus/U8g2@2.36.18
