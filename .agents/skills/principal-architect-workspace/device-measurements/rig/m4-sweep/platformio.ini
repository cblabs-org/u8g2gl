; M4 - xtensa sweep of the generated fixture corpus (device-measurements WO2). Build only.
;
; Platform: `espressif32` resolves to the pre-installed pioarduino checkout
; ~/.platformio/platforms/espressif32 = commit 5f39b6db, platform.json 55.03.311
; (arduino-esp32 3.3.11, ESP-IDF 5.5.5, xtensa-esp-elf 14.2.0_20260121). It is the same
; resolution foundation's `platform = espressif32` gets. See PR06-SPEC.md for why it is
; not pinned harder here (a git-URL pin would clone from the network).
;
; Source: src/main.cpp + a copy of one generated project, picked by build_src_filter.
; M4_SCREEN names the project's screen so main.cpp links its entry points.

[common]
platform              = espressif32
framework             = arduino
board_build.partitions = default.csv
build_unflags         = -std=gnu++11
; -std=gnu++17        corpus/foundation requirement (generated code; foundation uses it too)
; -Wall -Wextra       the diagnostics this sweep exists to surface
; -I <dir>            makes generated "u8g2gl_generated_config.h" findable from library units
; -D U8G2GL_GENERATED_CONFIG=...  spec 16: reaches the library's own u8g2gl_obj.cpp
base_flags            =
    -std=gnu++17
    -Wall
    -Wextra
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE

[xt_esp32dev]
board                 = esp32dev
[xt_nano]
board                 = arduino_nano_esp32
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags_nano      =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- corpus (fixture expected/), runtime = this worktree ----
[env:esp32dev]
extends = common, xt_esp32dev
build_src_filter = +<main.cpp> +<../corpus/*.cpp>
build_flags = ${common.base_flags} -I corpus -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\" -DM4_SCREEN=home
lib_deps = symlink://${U8G2GL_WORKTREE}
           olikraus/U8g2@2.36.18

[env:nano_esp32]
extends = common, xt_nano
build_src_filter = +<main.cpp> +<../corpus/*.cpp>
build_flags = ${common.base_flags} ${xt_nano.build_flags_nano} -I corpus -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\" -DM4_SCREEN=home
lib_deps = symlink://${U8G2GL_WORKTREE}
           olikraus/U8g2@2.36.18

; ---- positive control: pre-fix runtime + fixture at u8g2gl-05r/wo3-platformio ----
[env:ctl_esp32dev]
extends = common, xt_esp32dev
build_src_filter = +<main.cpp> +<../control/cli/test/generator/fixtures/emit-project/expected/*.cpp>
build_flags = ${common.base_flags} -I control/cli/test/generator/fixtures/emit-project/expected -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\" -DM4_SCREEN=home
lib_deps = symlink://${U8G2GL_WORKTREE}/tmp/m4/control
           olikraus/U8g2@2.36.18

[env:ctl_nano_esp32]
extends = common, xt_nano
build_src_filter = +<main.cpp> +<../control/cli/test/generator/fixtures/emit-project/expected/*.cpp>
build_flags = ${common.base_flags} ${xt_nano.build_flags_nano} -I control/cli/test/generator/fixtures/emit-project/expected -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\" -DM4_SCREEN=home
lib_deps = symlink://${U8G2GL_WORKTREE}/tmp/m4/control
           olikraus/U8g2@2.36.18

; ---- foundation's committed generated project, runtime = this worktree ----
[env:fdn_esp32dev]
extends = common, xt_esp32dev
build_src_filter = +<main.cpp> +<../fdn-gen/*.cpp>
build_flags = ${common.base_flags} -I fdn-gen -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\" -DM4_SCREEN=diagnostics
lib_deps = symlink://${U8G2GL_WORKTREE}
           olikraus/U8g2@2.36.18

[env:fdn_nano_esp32]
extends = common, xt_nano
build_src_filter = +<main.cpp> +<../fdn-gen/*.cpp>
build_flags = ${common.base_flags} ${xt_nano.build_flags_nano} -I fdn-gen -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\" -DM4_SCREEN=diagnostics
lib_deps = symlink://${U8G2GL_WORKTREE}
           olikraus/U8g2@2.36.18

; ---- the same corpus with -std=gnu++17 EFFECTIVE. The platform's own flags end in
; "-std=gnu++2b ... -std=gnu++2a", and the last -std wins, so a bare -std=gnu++17 in
; build_flags is overridden (found in the esp32dev log). These envs unflag them. ----
[env:esp32dev_std17]
extends = env:esp32dev
build_unflags = -std=gnu++11 -std=gnu++2a -std=gnu++2b
[env:nano_esp32_std17]
extends = env:nano_esp32
build_unflags = -std=gnu++11 -std=gnu++2a -std=gnu++2b

; ---- strict: gnu++17 effective AND the warnings the platform switches off re-enabled
; (-Wno-unused-parameter -Wno-sign-compare -Wno-missing-field-initializers are in the
; platform's flags) plus -Wformat=2 -Wconversion -Wshadow. Informational: shows what
; -Wall -Wextra would say if the platform did not mute part of -Wextra. ----
[env:esp32dev_strict]
extends = env:esp32dev
build_unflags = -std=gnu++11 -std=gnu++2a -std=gnu++2b -Wno-unused-parameter -Wno-sign-compare -Wno-missing-field-initializers
build_flags = ${env:esp32dev.build_flags} -Wsign-compare -Wunused-parameter -Wmissing-field-initializers -Wformat=2 -Wconversion -Wshadow
[env:nano_esp32_strict]
extends = env:nano_esp32
build_unflags = -std=gnu++11 -std=gnu++2a -std=gnu++2b -Wno-unused-parameter -Wno-sign-compare -Wno-missing-field-initializers
build_flags = ${env:nano_esp32.build_flags} -Wsign-compare -Wunused-parameter -Wmissing-field-initializers -Wformat=2 -Wconversion -Wshadow

[env:wo1_m1_esp32dev]
extends = common, xt_esp32dev
build_src_filter = +<main.cpp> +<../wo1-m1/*.cpp>
build_flags = ${common.base_flags} -I wo1-m1 -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\" -DM4_SCREEN=measure
lib_deps = symlink://${U8G2GL_WORKTREE}
           olikraus/U8g2@2.36.18

