; PR-05R WO7 - on-device criterion 1 firmware (build only; the PA flashes).
;
; Foundation's `connected` diagnostics frame, rendered through U8G2GL by a plain
; user (U8G2 begin() only) on the ESP32-S3 Nano + SSD1322. Two envs share one
; src/main.cpp and differ only in which U8G2GL runtime they link:
;   device_after  - this worktree (u8g2gl-05r/wo6-readability)
;   device_before - git archive of origin/main in runtime-before/
;
; Board options are copied from foundation's [env:esp32s3nano]
; (../fdn/platformio.ini, foundation held tip 499142f8), minus everything the
; foundation app needs and this rig does not (espidf, sdkconfig, web, MCP, ...).

[platformio]
default_envs = device_after, device_before

[device]
platform              = espressif32
board                 = arduino_nano_esp32
framework             = arduino
upload_protocol       = esptool
monitor_speed         = 115200
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; The committed generated project, used as-is (not regenerated).
build_src_filter      = +<*> +<../../fdn/uidesign/ssd1322-256x64/u8g2gl/generated/>
build_flags           =
    -std=gnu++17
    -I ../fdn/uidesign/ssd1322-256x64/u8g2gl/generated
    -D U8G2GL_GENERATED_CONFIG=\"u8g2gl_generated_config.h\"
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DU8G2_WITHOUT_FONT_ROTATION
    -DU8G2_WITHOUT_UNICODE
build_unflags         = -std=gnu++11
lib_ldf_mode          = deep+

[env:device_after]
extends               = device
build_flags           =
    ${device.build_flags}
    -D DEVICE_RIG_ENV=\"device_after\"
lib_deps              =
    symlink://${U8G2GL_WORKTREE}
    olikraus/U8g2@2.36.18

; origin/main's runtime predates U8G2GL_GENERATED_CONFIG, so there the macro is
; inert and the library's binding pool keeps u8g2gl_config.h's (larger) defaults.
; The capacities size a pool in u8g2gl_obj.cpp only; no class layout depends on
; them, so this costs RAM, not correctness or pixels.
[env:device_before]
extends               = device
build_flags           =
    ${device.build_flags}
    -D DEVICE_RIG_ENV=\"device_before\"
lib_deps              =
    symlink://${U8G2GL_WORKTREE}/tmp/device/runtime-before
    olikraus/U8g2@2.36.18
