name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp-tests:
    # Build and run the C++ test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Init U8G2 submodule
        # .gitmodules sets update = none; override with --checkout
        run: git submodule update --init --checkout extern/u8g2
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: cd build && ctest --output-on-failure

  cli-tests:
    # Build and run the CLI test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Init U8G2 submodule
        # CLI tests need BDF font files from extern/u8g2
        run: git submodule update --init --checkout extern/u8g2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: No home-folder paths in tracked files
        # The guard's self-test first: a guard that has stopped detecting
        # planted paths would otherwise pass every tree.
        run: |
          node scripts/check-home-paths.mjs --self-test
          node scripts/check-home-paths.mjs
      - name: Install
        run: cd cli && npm ci
      - name: Test
        run: cd cli && npm test

  wasm-tests:
    # The editor Wasm, built and run in CI. Emscripten is the pinned release, installed the way `u8g2gl toolchain install` does:
    # emsdk cloned at the pinned tag, its HEAD checked against the pinned
    # commit, then `emsdk install` / `activate` (emsdk verifies its own
    # archives). No third-party setup action. Cached by version and commit.
    runs-on: ubuntu-latest
    env:
      # The same pin as cli/src/node/toolchain/toolchain-paths.ts
      # (EMSCRIPTEN_VERSION, EMSDK_COMMIT): change both together, or CI builds
      # with a compiler the toolchain code refuses.
      EMSDK_VERSION: '5.0.3'
      EMSDK_COMMIT: a620cf1d71c62dfdfbb0c01fe0a371e2af2dda6c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Init U8G2 submodule
        # .gitmodules sets update = none; override with --checkout
        run: git submodule update --init --checkout extern/u8g2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ env.EMSDK_COMMIT }}
      - name: Install Emscripten ${{ env.EMSDK_VERSION }} (pinned)
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Verify the emsdk checkout is the pinned commit
        # On a cache hit too: a cache is only as trustworthy as its key.
        run: |
          HEAD_COMMIT=$(git -C "$HOME/emsdk" rev-parse HEAD)
          if [ "$HEAD_COMMIT" != "$EMSDK_COMMIT" ]; then
            echo "::error::emsdk is at $HEAD_COMMIT, not the pinned $EMSDK_COMMIT"
            exit 1
          fi
      - name: Build the framework editor Wasm
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcc --version | head -1
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j$(nproc) --target u8g2gl_editor
      - name: Wasm snapshot test (D-9 parity golden)
        run: node wasm/test/snapshot.test.mjs
      - name: Wasm placeholder test
        run: node wasm/test/placeholder.test.mjs
      - name: Wasm last-error test
        run: node wasm/test/last-error.test.mjs
      - name: Install CLI
        run: cd cli && npm ci
      - name: CLI tests that need Emscripten, with Emscripten present
        # They skip with a message when no toolchain is found; here that would
        # hide a broken job, so the message fails the step.
        run: |
          set -o pipefail
          source "$HOME/emsdk/emsdk_env.sh"
          cd cli
          npx vitest run test/node/design/build test/node/toolchain 2>&1 | tee "$RUNNER_TEMP/wasm-cli-tests.txt"
          if grep -q "skipped, no Emscripten" "$RUNNER_TEMP/wasm-cli-tests.txt"; then
            echo "::error::the Emscripten-dependent CLI tests were skipped: no toolchain detected"
            exit 1
          fi
          node dist/node/cli.js toolchain status

  designer-e2e:
    # The designer end to end: the built CLI's `u8g2gl design` serving the
    # built designer, driven by Playwright in Chromium, Firefox and WebKit,
    # headless. It checks editing reaches the canvas, Problems rows, saving
    # beside an IDE, the no-toolchain fallback and keystroke latency. The
    # framework editor Wasm is built first because the designer bundles it.
    # Emscripten is the same pinned emsdk as wasm-tests and is on PATH for the
    # suite, so the project-renderer test runs too; the no-toolchain tests take
    # it off PATH for their own server. The keystroke latency gates report here
    # without failing the job (CI machines vary; the numbers are in the uploaded
    # keystroke-performance.json) and gate locally.
    #
    # The suite runs against the end-to-end test build, which carries test
    # hooks. The production build is then built, checked by grep to contain no
    # hook, and its own editing test run in all three engines.
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: '5.0.3'
      EMSDK_COMMIT: a620cf1d71c62dfdfbb0c01fe0a371e2af2dda6c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Init U8G2 submodule
        # .gitmodules sets update = none; override with --checkout
        run: git submodule update --init --checkout extern/u8g2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Cache Emscripten
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ env.EMSDK_COMMIT }}
      - name: Install Emscripten ${{ env.EMSDK_VERSION }} (pinned)
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Verify the emsdk checkout is the pinned commit
        run: |
          HEAD_COMMIT=$(git -C "$HOME/emsdk" rev-parse HEAD)
          if [ "$HEAD_COMMIT" != "$EMSDK_COMMIT" ]; then
            echo "::error::emsdk is at $HEAD_COMMIT, not the pinned $EMSDK_COMMIT"
            exit 1
          fi
      - name: Build the framework editor Wasm
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j$(nproc) --target u8g2gl_editor
      - name: Build the CLI
        run: cd cli && npm ci && npm run build
      - name: Build the designer (end-to-end test build)
        run: cd designer && npm ci && npm run build:e2e
      - name: Install Playwright's browsers
        run: cd designer && npx playwright install --with-deps chromium firefox webkit
      - name: Designer unit tests
        run: cd designer && npm run test:unit
      - name: Designer end-to-end tests
        # emsdk_env.sh puts emsdk's own Node first on PATH; the runner's Node 22
        # is put back in front, so the suite runs on the Node every other job uses.
        run: |
          RUNNER_NODE_DIR=$(dirname "$(command -v node)")
          source "$HOME/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_NODE_DIR:$PATH"
          node --version
          em++ --version | head -1
          cd designer && npm run test:e2e
      - name: Build the designer (production) and check it carries no test hook
        run: |
          cd designer && npm run build
          if grep -rlE '__u8g2gl|installTestHooks|u8g2gl:key-to-blit|E2E-TEST-BUILD' dist; then
            echo "::error::the production designer build contains a test hook"
            exit 1
          fi
      - name: Designer editing test against the production build
        run: cd designer && npm run test:e2e:production
      - name: Upload the end-to-end results (keystroke timings included)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: designer-e2e-results
          path: designer/test-results/
          if-no-files-found: ignore

  determinism-check:
    # §13.9 determinism condition:
    # A generator change that alters output without an input change requires a CLI version bump.
    # Checked as a diff property between merge-base (origin/main) and HEAD.
    #
    # Demonstrated failure evidence (recorded per WO4 checklist):
    #   Synthetic commit modifying golden without input change or version bump failed with:
    #   "::error::Generator output changed without an input change and without a CLI version bump (§13.9)."
    #   "Generator output changed without an input change and without a CLI version bump (§13.9)."
    #   Exit code: 1
    needs: cli-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch origin/main
        run: git fetch origin main --depth=1 || git fetch origin main || true
      - name: Run determinism check (§13.9)
        run: |
          MERGE_BASE=$(git merge-base HEAD origin/main 2>/dev/null || true)
          if [ -z "$MERGE_BASE" ]; then
            echo "Warning: Could not compute merge-base between HEAD and origin/main; falling back to HEAD~1"
            MERGE_BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi

          echo "Determinism check (§13.9)"
          echo "  Merge base: $MERGE_BASE"
          echo "  HEAD:       $(git rev-parse HEAD)"

          CHANGED_FILES=$(git diff --name-only "$MERGE_BASE" HEAD)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed. Determinism check passed trivially."
            exit 0
          fi

          # Find all changed golden files under cli/test/generator/fixtures/*/expected/**
          CHANGED_GOLDENS=()
          CHANGED_FIXTURE_DIRS=()

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              cli/test/generator/fixtures/*/expected/*)
                CHANGED_GOLDENS+=("$file")
                FIXTURE_DIR=$(echo "$file" | sed -E 's|^(cli/test/generator/fixtures/[^/]+)/expected/.*|\1|')
                case " ${CHANGED_FIXTURE_DIRS[*]:-} " in
                  *" $FIXTURE_DIR "*) ;;
                  *) CHANGED_FIXTURE_DIRS+=("$FIXTURE_DIR") ;;
                esac
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ ${#CHANGED_GOLDENS[@]} -eq 0 ]; then
            echo "No fixture goldens changed. Determinism check passed trivially."
            exit 0
          fi

          echo "Found ${#CHANGED_GOLDENS[@]} changed golden file(s) across ${#CHANGED_FIXTURE_DIRS[@]} fixture(s):"
          for f in "${CHANGED_GOLDENS[@]}"; do
            echo "  - $f"
          done

          # For each fixture directory with changed goldens, check for changed input files.
          # Input files are anything under the fixture directory that is NOT under expected/.
          UNACCOMPANIED_FIXTURES=()

          for fdir in "${CHANGED_FIXTURE_DIRS[@]}"; do
            HAS_INPUT=0
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                "${fdir}/expected/"*)
                  ;;
                "${fdir}/"*)
                  HAS_INPUT=1
                  echo "Fixture '$fdir' has input change: $file"
                  break
                  ;;
              esac
            done <<< "$CHANGED_FILES"

            if [ $HAS_INPUT -eq 0 ]; then
              UNACCOMPANIED_FIXTURES+=("$fdir")
            fi
          done

          if [ ${#UNACCOMPANIED_FIXTURES[@]} -eq 0 ]; then
            echo "All changed goldens have corresponding fixture input changes. Determinism check passed."
            exit 0
          fi

          echo "The following fixture(s) had golden changes WITHOUT input changes:"
          for uf in "${UNACCOMPANIED_FIXTURES[@]}"; do
            echo "  - $uf"
          done

          get_version() {
            local ref="$1"
            local content
            content=$(git show "${ref}:cli/package.json" 2>/dev/null || echo "{}")
            if command -v node >/dev/null 2>&1; then
              echo "$content" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).version||"")}catch{console.log("")}})'
            elif command -v jq >/dev/null 2>&1; then
              echo "$content" | jq -r '.version // empty'
            else
              echo "$content" | grep '"version"' | head -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'
            fi
          }

          BASE_VER=$(get_version "$MERGE_BASE")
          HEAD_VER=$(get_version "HEAD")

          echo "CLI version at merge base ($MERGE_BASE): '$BASE_VER'"
          echo "CLI version at HEAD:                     '$HEAD_VER'"

          if [ -z "$HEAD_VER" ] || [ "$BASE_VER" = "$HEAD_VER" ]; then
            echo "::error::Generator output changed without an input change and without a CLI version bump (§13.9)."
            echo "Generator output changed without an input change and without a CLI version bump (§13.9)." >&2
            exit 1
          fi

          echo "CLI version was bumped from $BASE_VER to $HEAD_VER. Determinism check passed (§13.9)."
          exit 0

  xtensa-cross-compile:
    # Cross-compile generated fixtures against the xtensa target
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env_name: esp32dev_std17
            std_label: "gnu++17 (asserted)"
          - env_name: esp32dev_injected
            std_label: "platform-injected standard"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Init U8G2 submodule
        # .gitmodules sets update = none; override with --checkout
        run: git submodule update --init --checkout extern/u8g2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-xtensa-${{ hashFiles('test/xtensa/platformio.ini') }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: "Build xtensa (${{ matrix.std_label }})"
        run: cd test/xtensa && pio run -e ${{ matrix.env_name }}
      - name: "Positive control must FAIL"
        run: |
          cd test/xtensa
          if pio run -e ctl_${{ matrix.env_name }} 2>&1; then
            echo "::error::Positive control passed — the check no longer detects the defect class"
            exit 1
          else
            echo "Positive control failed as expected (xtensa overload ambiguity detected)"
          fi
